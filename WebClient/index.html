<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>MailSender WebClient</title>
</head>

<body>
    <h1>MailSender WebClient</h1>

    <p>Prosty klient HTML do wysyłania wiadomości przez API MailSender.</p>

    <div>
        <label for="apiUrl">Adres API:</label><br>
        <input id="apiUrl" type="text" value="http://localhost:5096" style="width: 400px;">
    </div>

    <br>

    <div>
        <label for="token">Token JWT:</label><br>
        <textarea id="token" rows="4" cols="80"></textarea>
    </div>

    <br>

    <div>
        <label for="to">Odbiorca:</label><br>
        <input id="to" type="email" style="width: 400px;">
    </div>

    <br>

    <div>
        <label for="subject">Temat:</label><br>
        <input id="subject" type="text" style="width: 400px;">
    </div>

    <br>

    <div>
        <label for="body">Treść:</label><br>
        <textarea id="body" rows="6" cols="80"></textarea>
    </div>

    <br>

    <button onclick="sendMail()">Wyślij wiadomość</button>

    <h3>Odpowiedź API:</h3>
    <pre id="result"></pre>

    <script>
        async function sendMail() {
            const apiUrl = document.getElementById("apiUrl").value;
            const token = document.getElementById("token").value;
            const to = document.getElementById("to").value;
            const subject = document.getElementById("subject").value;
            const body = document.getElementById("body").value;

            const resultElement = document.getElementById("result");

            const requestBody = {
                to: to,
                subject: subject,
                body: body
            };

            try {
                const response = await fetch(apiUrl + "/mail/send", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify(requestBody)
                });

                const responseText = await response.text();

                resultElement.textContent =
                    "Status HTTP: " + response.status + "\n\n" + responseText;
            } catch (error) {
                resultElement.textContent = "Błąd: " + error;
            }
        }
    </script>
</body>

</html>
